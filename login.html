<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ReCycleHub</title>
  <meta name="description" content="Sign in to your ReCycleHub account to track recycling pickups, eco-rewards, and your environmental impact.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-body">
  <main class="auth-main" aria-labelledby="loginTitle">
    <section class="auth-card">
      <div class="auth-brand">
        <a href="index.html" class="brand-logo auth-brand-logo" aria-label="ReCycleHub homepage">
          <div class="brand-icon" aria-hidden="true">
            <i class="fa-solid fa-recycle"></i>
          </div>
          <span>ReCycle<span class="accent">Hub</span></span>
        </a>
      </div>

      <header class="auth-header">
        <h1 class="auth-title" id="loginTitle">Welcome back</h1>
        <p class="auth-subtitle">Sign in to track pickups, rewards, and your environmental impact.</p>
      </header>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-field" data-field="email">
          <label class="auth-label" for="loginEmail">Email address</label>
          <div class="auth-input-wrap">
            <i class="fa-regular fa-envelope auth-input-icon" aria-hidden="true"></i>
            <input class="auth-input" type="email" id="loginEmail" name="email" placeholder="you@example.com"
              autocomplete="email" inputmode="email" spellcheck="false" required aria-describedby="loginEmailError">
          </div>
          <p class="auth-error" id="loginEmailError" aria-live="polite"></p>
        </div>

        <div class="auth-field" data-field="password">
          <div class="auth-label-row">
            <label class="auth-label" for="loginPassword">Password</label>
            <a href="#" class="auth-link" id="forgotPassword">Forgot password?</a>
          </div>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock auth-input-icon" aria-hidden="true"></i>
            <input class="auth-input" type="password" id="loginPassword" name="password"
              placeholder="Enter your password" autocomplete="current-password" required
              aria-describedby="loginPasswordError">
            <button type="button" class="auth-password-toggle" data-password-toggle="loginPassword"
              aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-error" id="loginPasswordError" aria-live="polite"></p>
        </div>

        <div class="auth-meta">
          <label class="auth-check-label" for="rememberMe">
            <input class="auth-checkbox" type="checkbox" id="rememberMe" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" data-submit>
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
        </button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="auth-social">
        <a class="auth-social-btn" href="https://www.google.com" target="_blank" rel="noopener noreferrer"
          data-social-provider="Google" aria-label="Continue with Google">
          <svg class="social-google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          <span>Google</span>
        </a>
        <a class="auth-social-btn" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer"
          data-social-provider="Facebook" aria-label="Continue with Facebook">
          <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
          <span>Facebook</span>
        </a>
        <a class="auth-social-btn" href="https://www.apple.com" target="_blank" rel="noopener noreferrer"
          data-social-provider="Apple" aria-label="Continue with Apple">
          <i class="fa-brands fa-apple" aria-hidden="true"></i>
          <span>Apple</span>
        </a>
      </div>

      <p class="auth-switch">New to ReCycleHub? <a href="signup.html" class="auth-link">Create an account</a></p>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
