<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174D3A" />
      <stop offset="100%" stop-color="#0F3628" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="50%" stop-color="#B6D957" />
      <stop offset="100%" stop-color="#2E9870" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#B6D957" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container with Luxury Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#rchBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2E9870" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Eco Circular Mobius Arrow + Leaf Emblem -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#limeGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arc & Arrow -->
    <path d="M 23 18 L 33 18 A 14 14 0 0 1 47 32 L 47 35" />
    <path d="M 43 31 L 47 35 L 51 31" fill="none" stroke-width="4.2" />

    <!-- Bottom Right Arc & Arrow -->
    <path d="M 44 45 L 35 48 A 14 14 0 0 1 18 36" />
    <path d="M 18 42 L 18 36 L 24 36" fill="none" stroke-width="4.2" />

    <!-- Left Arc & Arrow -->
    <path d="M 18 27 A 14 14 0 0 1 29 18" />
  </g>

  <!-- Center Organic Sprout / Leaf Accent -->
  <path d="M 32 37 C 32 30 38 25 43 24 C 43 29 38 37 32 37 Z" fill="#B6D957" />
  <path d="M 32 37 C 28 34 26 31 27 28 C 29 28 31 31 32 37 Z" fill="#2E9870" opacity="0.9" />
</svg>

